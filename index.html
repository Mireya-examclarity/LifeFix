<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LifeFix</title>
<style>
body{background:#0f0f10;color:white;font-family: Arial,sans-serif;padding:20px;margin:0}
h1{font-size:40px;margin:0}
.small{color:grey;font-size:13px}
.box{background:#1c1c1e;border:1px solid #333;border-radius:15px;padding:18px;margin-bottom:15px}
input,select{width:100%;padding:10px;background:#2a2a2a;border:1px solid #444;color:white;border-radius:8px;margin-top:8px}
button{width:100%;padding:11px;border-radius:8px;border:none;font-weight:bold;margin-top:10px;cursor:pointer}
#btn1{background:white;color:black}
#btn2{background:#333;color:white}
.taskRow{background:#2a2a2a;padding:12px;border-radius:10px;margin-bottom:8px;display:flex;justify-content:space-between}
.scoreBox{background:#0a84ff;padding:2px 9px;border-radius:20px;font-size:12px}
.layout{display:flex;gap:15px}
.left{flex:1.2}
.right{flex:0.8}
@media(max-width:700px){.layout{flex-direction:column}}
</style>
</head>
<body>

<h1>LifeFix.</h1>
<p class="small">fix ur tasks and bills</p>

<div class="layout">
<div class="left">
<div class="box" style="border-color:#0a84ff">
<p class="small">FOCUS</p>
<p id="f1" style="font-size:19px;font-weight:bold;margin-top:5px">no task yet</p>
<p id="f2" class="small" style="margin-top:6px;line-height:1.4"></p>
<p id="f3" style="margin-top:10px"></p>
</div>

<div class="box">
<p class="small">ADD</p>
<input id="n" placeholder="task name like maths hw">
<input id="d" type="date">
<input id="h" type="number" placeholder="how many hours">
<select id="imp"><option>Low</option><option>Medium</option><option>High</option></select>
<button id="btn1" onclick="add()">Add</button>
</div>
</div>

<div class="right">
<div class="box">
<p class="small"><span id="doneC">0</span> / <span id="totC">0</span> done</p>
<div id="list" style="margin-top:12px"></div>
<a href="#" onclick="clr()" style="color:grey;font-size:12px">clear all</a>
</div>

<div class="box">
<p class="small">BILL</p>
<input id="b1" type="number" placeholder="total">
<input id="b2" type="number" placeholder="people">
<button id="btn2" onclick="sp()">split</button>
<p id="bR" class="small" style="margin-top:8px"></p>
</div>
</div>
</div>

<script>
var tasks = JSON.parse(localStorage.getItem('lf')||'[]');

function get_score(t)
  {  var today = new Date(); today.setHours(0,0,0,0);
    var dd = new Date(t.deadline); dd.setHours(0,0,0,0);
    var days = Math.round((dd - today)/86400000);
    var s1;
    if(days <= 0){ s1 = 100; }
    else if(days == 1){ s1 = 90; }
    else if(days <= 3){ s1 = 75; }
    else if(days <= 7){ s1 = 55; }
    else if(days <= 14){ s1 = 35; }
    else { s1 = 15; }
    var s2;
    if(t.importance == "Low") s2 = 20;
    else if(t.importance == "Medium") s2 = 50;
    else s2 = 100;
    var s3 = t.hours * 8;
    if(s3 > 80){ s3 = 80; }
    var final = s1*0.5 + s2*0.35 + s3*0.15;
    return Math.round(final*10)/10;}


function get_detailed_vision(t)
    { var today = new Date(); today.setHours(0,0,0,0);
    var dd = new Date(t.deadline); dd.setHours(0,0,0,0);
    var days = Math.round((dd - today)/86400000);
    if(days <= 0)
        { return "OVERDUE by "+Math.abs(days)+" days. If you ignore this it will cause more stress. Do this TODAY, no excuse.";}
    
    if(days == 1)
        {return "Deadline is tomorrow. This is your #1 priority. Finish it today and tomorrow you will be free.";}
    
    if(t.importance == "High" && days <= 3)
       { return "High importance and only "+days+" days left. This is what you should focus on more than anything else.";}
    
    if(t.hours > 4)
      {  return "This will take "+t.hours+" hours. Don't do it at last minute, split it - do 2 hours today.";}
    
    return "This is a quick task. Do it now to get  a small win and feel motivated. You will be able to achieve !";}


function add()
    {var name = document.getElementById('n').value;
    var date = document.getElementById('d').value;
    var hrs = document.getElementById('h').value;
    var imp = document.getElementById('imp').value;
    if(name==""||date==""){ alert("fill name and date"); return; }
    tasks.push({name:name, deadline:date, hours:parseFloat(hrs)||1, importance:imp, completed:false});
    document.getElementById('n').value="";
    localStorage.setItem('lf', JSON.stringify(tasks));
    show();}


function show()
  {   var sorted = tasks.slice().sort(function(a,b){ return get_score(b)-get_score(a); });
    document.getElementById('totC').innerText = tasks.length;
    document.getElementById('doneC').innerText = tasks.filter(x=>x.completed).length;
    
    var f = null;
    for(var i=0;i<sorted.length;i++){ if(!sorted[i].completed){ f=sorted[i]; break; } }
    if(f)
       {  document.getElementById('f1').innerText = f.name;
        document.getElementById('f2').innerText = get_detailed_vision(f);
        document.getElementById('f3').innerHTML = f.importance+" | "+f.hours+"h | "+f.deadline+' <span class="scoreBox">'+get_score(f)+'</span>';}
     else 
       { document.getElementById('f1').innerText = sorted.length ? "all done!" : "no task yet";
        document.getElementById('f2').innerText = "";
        document.getElementById('f3').innerHTML = "";}
    

    var html = "";
    for(var j=0;j<sorted.length;j++)
      {  var tt = sorted[j];
        html += '<div class="taskRow"><div><b>'+tt.name+'</b><br><span class="small">'+tt.deadline+'</span></div><div><span class="scoreBox">'+get_score(tt)+'</span> <input type="checkbox" '+(tt.completed?'checked':'')+' onclick="tick('+j+')"></div></div>';}
    
    document.getElementById('list').innerHTML = html || '<span class="small">empty</span>';}


function tick(idx)
   { var sorted = tasks.slice().sort(function(a,b){ return get_score(b)-get_score(a); });
    var realIdx = tasks.indexOf(sorted[idx]);
    tasks[realIdx].completed = !tasks[realIdx].completed;
    localStorage.setItem('lf', JSON.stringify(tasks));
    show();}

function clr(){ if(confirm("clear?")){ tasks=[]; localStorage.setItem('lf', JSON.stringify(tasks)); show(); } }
function sp()
    { var a = parseFloat(document.getElementById('b1').value)||0;
    var p = parseInt(document.getElementById('b2').value)||1;
    document.getElementById('bR').innerText = "each: ₹"+(a/p).toFixed(2);}

show();
</script>
</body>
</html>
