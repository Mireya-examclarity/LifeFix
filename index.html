<!DOCTYPE html>
<html>
<head>
<title>LifeFix - focus more</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
body{ 
  background:#f7f5ef; 
  font-family:'Inter', sans-serif; 
  padding:16px; 
  margin:0;
  color:#1a1a1a;}

h1,h3{ font-family:'Space Grotesk'; }
.container{ max-width:640px; margin:0 auto; }
.box{ 
  background:white; 
  border:2px solid black; 
  border-radius:16px; 
  padding:16px; 
  margin:12px 0; 
  box-shadow:4px 4px 0px black; }

.focus-box{ 
  background:#ffcc5c; 
  border-style:dashed;
  position:relative;}

.focus-box::after{
  content:"";
  position:absolute;
  top:-8px; right:18px;
  width:18px; height:18px;
  background:#82b1ff;
  border:2px solid black;
  border-radius:50%;}

input,select
{ 
  padding:8px 10px; 
  border:2px solid black; 
  border-radius:10px; 
  margin:4px; 
  font-family:inherit;
  background:white;}

button
{ 
  background:#82b1ff; 
  border:2px solid black; 
  padding:8px 14px; 
  border-radius:10px; 
  font-weight:bold; 
  cursor:pointer;
  font-family:'Space Grotesk';}

button:active{ transform:translate(2px,2px); }
.score{ float:right; background:black; color:white; padding:3px 8px; border-radius:8px; font-size:11px; font-family:'Space Grotesk';}
.small{ font-size:12px; color:#666; }
#billBox{ background:#eaf6ff; }
.sticker{ text-align:center; font-size:11px; color:#aaa; margin-top:30px; }
</style>
</head>
<body>
<div class="container">

<h1 style="text-align:center; margin-bottom:2px;">LifeFix ✨</h1>
<p style="text-align:center; font-size:13px; color:#777; margin-top:0;">What is annoying daily that software can make easier?</p>

<div id="focusArea" style="display:none;" class="box focus-box">
  <h3 style="margin:0;">👉 Your focus right now:</h3>
  <h2 id="focusName" style="margin:6px 0;"></h2>
  <p id="focusVision" style="font-size:14px; margin:0; line-height:1.5;"></p>
  <p id="focusPlan" style="font-size:12px; margin-top:10px;"></p>
</div>

<div class="box">
  <h3 style="margin:0 0 10px 0;">+ add what is annoying you</h3>
  <div>
    <input id="nameIn" placeholder="eg maths homework" style="width:160px;">
    <input id="dateIn" type="date">
    <input id="hoursIn" type="number" step="0.5" placeholder="hrs" style="width:60px;">
    <select id="impIn"><option>Low</option><option>Medium</option><option>High</option></select>
    <button onclick="addTask()">Add</button>
  </div>
  <div style="margin-top:10px;">
    <a href="#" onclick="clearAll()" style="color:red; font-size:11px;">clear all</a>
    <span class="small" style="margin-left:10px;">no login - saves in browser</span>
  </div>
</div>

<h3 id="countHead">All tasks - 0/0</h3>
<div id="tasksList"></div>

<div class="box" id="billBox">
  <h3 style="margin:0 0 8px 0;">💸 Quick bill split</h3>
  <input id="billTotal" type="number" placeholder="total ₹" style="width:90px;">
  <input id="billPeople" type="number" placeholder="people" style="width:80px;">
  <button onclick="splitBill()" style="background:#a5d6a7;">Split</button>
  <p id="billOut" class="small" style="margin-top:8px;"></p>
</div>

<p class="sticker">made for daily life problems - not just a todo list<br>LifeFix v1</p>

</div>

<script>
let tasks = JSON.parse(localStorage.getItem('lifefix_tasks') || '[]');

function scoreFunc(t)
{
  let today = new Date();
  let deadline = new Date(t.deadline);
  let diff = Math.ceil((deadline - today)/(1000*60*60*24));
  if(diff < 0) diff = 0;
  let imp = t.importance == 'High' ? 3 : t.importance == 'Medium' ? 2 : 1;
  let score = (10 - Math.min(diff,9)) * 2 + imp*3 + t.hours*0.8;
  return Math.round(score);}


function getVision(t)
{  let s = scoreFunc(t);
  if(s > 22) return "Do this TODAY. Its deadline is close and it matters. Break it into " + Math.ceil(t.hours) + " small chunks, start with 20 mins now.";
  if(s > 15) return "This is your next priority. Finish after focus task. You need " + t.hours + "h - block calendar tomorrow.";
  return "Low pressure but dont forget. Do it when you have free gap. Keep it ready before " + t.deadline;}


function save()

  { localStorage.setItem('lifefix_tasks', JSON.stringify(tasks));
  render();}


function addTask()
 { let name = document.getElementById('nameIn').value; 
  let deadline = document.getElementById('dateIn').value;
  let hours = parseFloat(document.getElementById('hoursIn').value);
  let importance = document.getElementById('impIn').value;
  if(!name || !deadline || !hours){ alert('fill all'); return; }
  tasks.push({name, deadline, hours, importance, completed:false});
  document.getElementById('nameIn').value = '';
  document.getElementById('hoursIn').value = '';
  save();}


function toggleDone(i)

 { tasks[i].completed = !tasks[i].completed;
  save();}


function clearAll()
 { if(confirm('clear all?')){ tasks=[]; save(); }}


function render()

  { let list = document.getElementById('tasksList');
  list.innerHTML = '';
  let done = tasks.filter(t=>t.completed).length;
  document.getElementById('countHead').innerText = `All tasks - ${done}/${tasks.length}`;


  let active = tasks.filter(t=>!t.completed);
  active.sort((a,b)=> scoreFunc(b) - scoreFunc(a));
  if(active.length > 0){
    let f = active[0];
    document.getElementById('focusArea').style.display = 'block';
    document.getElementById('focusName').innerText = f.name;
    document.getElementById('focusVision').innerText = getVision(f);
    document.getElementById('focusPlan').innerHTML = `<b>Plan:</b> ${f.hours}h needed | Deadline: ${f.deadline} | Score: ${scoreFunc(f)}`;}
    else 
   { document.getElementById('focusArea').style.display = 'none';}
  


  tasks.forEach((t,i)=>{
    let bg = '#fff';
    if(t.completed) bg = '#eee';
    else if(t.importance=='High') bg = '#ffdde0';
    else bg = '#eaf6ff';
    

    let div = document.createElement('div'); 
    div.className = 'box';
    div.style.background = bg;
    if(t.completed) div.style.opacity = '0.6';
    div.innerHTML = `
      <b style="${t.completed?'text-decoration:line-through':''}">${t.name}</b> - ${t.deadline} - ${t.hours}h
      <span class="score">${scoreFunc(t)}</span>
      <br><button onclick="toggleDone(${i})" style="margin-top:8px; background:${t.completed?'#ccc':'#a5d6a7'}">${t.completed?'undo':'done'}</button>
      <span class="small" style="margin-left:8px;">${t.importance}</span>
    `;
    list.appendChild(div);});}

  

function splitBill()
 { let total = parseFloat(document.getElementById('billTotal').value);
  let people = parseInt(document.getElementById('billPeople').value);
  if(!total || !people){ document.getElementById('billOut').innerText = 'enter total and people'; return; }
  let per = (total/people).toFixed(2);
  document.getElementById('billOut').innerText = `Each pays ₹${per} - from total ₹${total} among ${people} people`;}


render();
document.getElementById('dateIn').valueAsDate = new Date();
</script>

</body>
</html>
